<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Home</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">

    <style>
        body {font-family:Poppins;background:#f5f7fb;}

        .navbar {background:#0f172a;}

        .hero {
            background:url('https://images.unsplash.com/photo-1521737604893-d14cc237f11d') center/cover;
            height:85vh;
            display:flex;
            align-items:center;
            justify-content:center;
            color:white;
            position:relative;
        }

        .hero::before{
            content:"";
            position:absolute;
            width:100%;
            height:100%;
            background:rgba(0,0,0,0.6);
        }

        .hero-content{
            position:relative;
            text-align:center;
            animation:fade 1s ease-in;
        }

        @keyframes fade{
            from{opacity:0;transform:translateY(20px);}
            to{opacity:1;transform:translateY(0);}
        }

        .btn-main{
            background:#00c896;
            color:white;
            padding:12px 25px;
            border-radius:30px;
        }

        .card-hover{transition:0.3s;border:none;border-radius:15px;}
        .card-hover:hover{transform:translateY(-8px);}
    </style>
</head>

<body>

<nav class="navbar navbar-dark px-4">
    <a class="navbar-brand">JobEntry 🚀</a>
    <a th:href="@{/}" class="text-white">Logout</a>
</nav>

<div class="hero">
    <div class="hero-content">
        <h1>Find Your Dream Job</h1>
        <p>Top companies hiring now</p>
        <a th:href="@{/jobs}" class="btn btn-main mt-3">Browse Jobs</a>
    </div>
</div>

<div class="container mt-5">
    <h3>Explore Categories</h3>

    <div class="row g-3 mt-2">

        <div class="col-md-3"><div class="card card-hover p-3 text-center">💻 Software</div></div>
        <div class="col-md-3"><div class="card card-hover p-3 text-center">📊 Data</div></div>
        <div class="col-md-3"><div class="card card-hover p-3 text-center">🧑‍💼 HR</div></div>
        <div class="col-md-3"><div class="card card-hover p-3 text-center">🚀 Startup</div></div>

    </div>
</div>

</body>
</html>
