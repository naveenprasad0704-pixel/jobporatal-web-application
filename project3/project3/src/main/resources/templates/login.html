<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <title>Login</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">

  <style>
    body{
      font-family:Poppins;
      background:url('https://images.unsplash.com/photo-1521737604893-d14cc237f11d') center/cover;
      height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;
    }

    .overlay{
      position:absolute;
      width:100%;
      height:100%;
      background:rgba(0,0,0,0.6);
    }

    .login-box{
      position:relative;
      background:white;
      padding:40px;
      border-radius:20px;
      width:360px;
      animation:pop .8s ease-in;
    }

    @keyframes pop{
      from{transform:scale(.8);opacity:0;}
      to{transform:scale(1);opacity:1;}
    }

    img{
      width:100%;
      height:120px;
      object-fit:cover;
      border-radius:10px;
      margin-bottom:10px;
    }

    .btn-custom{
      background:#0f766e;
      color:white;
    }
  </style>
</head>

<body>

<div class="overlay"></div>

<div class="login-box text-center">

  <img src="https://images.unsplash.com/photo-1522202176988-66273c2fd55f">

  <h3>Job Portal Login</h3>

  <form th:action="@{/login}" method="post">

    <input type="email" class="form-control mb-2" placeholder="Email" required>

    <input type="password" class="form-control mb-3" placeholder="Password" required>

    <button class="btn btn-custom w-100">Login</button>

  </form>

</div>

</body>
</html>
