<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Success</title>

    <meta http-equiv="refresh" content="3;url=/home"/>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">

    <style>
        body{
            font-family:Poppins;
            background:url('https://images.unsplash.com/photo-1522071820081-009f0129c71c') center/cover;
        }

        .overlay{
            background:rgba(0,0,0,0.6);
            height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
        }

        .box{
            text-align:center;
            background:white;
            padding:50px;
            border-radius:20px;
            animation:pop 0.8s ease-in;
            box-shadow:0 10px 25px rgba(0,0,0,0.2);
            width:420px;
        }

        @keyframes pop{
            from{transform:scale(0.8);opacity:0;}
            to{transform:scale(1);opacity:1;}
        }

        .success-img{
            width:120px;
            margin-bottom:15px;
            animation: float 2s ease-in-out infinite;
        }

        @keyframes float{
            0%{transform:translateY(0);}
            50%{transform:translateY(-10px);}
            100%{transform:translateY(0);}
        }

        .btn-main{
            background:#14b8a6;
            color:white;
            border-radius:30px;
            padding:10px 25px;
        }
    </style>
</head>

<body>

<div class="overlay">

    <div class="box">

        <!-- ✅ SUCCESS IMAGE ADDED -->
        <img class="success-img"
             src="https://cdn-icons-png.flaticon.com/512/845/845646.png">

        <h2 class="text-success">✔ Application Submitted</h2>

        <p class="text-muted">Your resume has been successfully uploaded</p>

        <p>Redirecting to Home...</p>

        <a th:href="@{/home}" class="btn btn-main mt-3">
            Go Home
        </a>

    </div>

</div>

</body>
</html>
