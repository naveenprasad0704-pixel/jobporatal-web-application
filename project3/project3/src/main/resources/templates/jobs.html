<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Jobs</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">

    <style>
        body{font-family:Poppins;background:#f5f7fb;}

        .job-card{
            border:none;
            border-radius:18px;
            overflow:hidden;
            transition:0.3s;
        }

        .job-card:hover{
            transform:scale(1.03);
        }

        .job-img{
            height:160px;
            object-fit:cover;
        }
    </style>
</head>

<body>

<div class="container mt-5">

    <h2 class="mb-4">🔥 Latest Jobs</h2>

    <div class="row">

        <div class="col-md-4 mb-3" th:each="job : ${jobs}">

            <div class="card job-card shadow">

                <img class="job-img"
                     src="https://images.unsplash.com/photo-1522202176988-66273c2fd55f"/>

                <div class="p-3">

                    <h5 th:text="${job.title}"></h5>

                    <p class="text-success" th:text="${job.company}"></p>

                    <p th:text="${job.description}"></p>

                    <a th:href="@{/job/{id}(id=${job.id})}"
                       class="btn btn-primary btn-sm">
                        View Details
                    </a>

                </div>
            </div>

        </div>

    </div>

</div>

</body>
</html>
