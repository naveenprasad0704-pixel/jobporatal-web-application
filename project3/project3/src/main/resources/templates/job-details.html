<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Job Details</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">

    <style>
        body{
            font-family:Poppins;
            background:url('https://images.unsplash.com/photo-1521737604893-d14cc237f11d') center/cover;
        }

        .overlay{
            background:rgba(0,0,0,0.6);
            min-height:100vh;
            padding:50px;
        }

        .box{
            background:white;
            padding:40px;
            border-radius:20px;
            animation:fade 0.8s ease-in;
        }

        @keyframes fade{
            from{opacity:0;transform:translateY(20px);}
            to{opacity:1;transform:translateY(0);}
        }
    </style>
</head>

<body>

<div class="overlay">

    <div class="container">

        <div th:if="${job != null}" class="box">

            <h2 th:text="${job.title}"></h2>

            <h5 class="text-success" th:text="${job.company}"></h5>

            <p th:text="${job.description}"></p>

            <hr>

            <h5>Why Join Us?</h5>
            <ul>
                <li>High Salary</li>
                <li>Remote Work</li>
                <li>Growth Opportunities</li>
            </ul>

            <a th:href="@{/upload(jobId=${job.id})}"
               class="btn btn-success">
                Apply Now
            </a>

            <a th:href="@{/jobs}"
               class="btn btn-secondary ms-2">
                Back
            </a>

        </div>

    </div>

</div>

</body>
</html>
