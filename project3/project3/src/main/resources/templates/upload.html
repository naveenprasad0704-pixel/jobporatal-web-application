<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Upload Resume</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">

    <style>
        body{
            font-family:Poppins;
            background:url('https://images.unsplash.com/photo-1521737604893-d14cc237f11d') center/cover;
        }

        .overlay{
            background:rgba(0,0,0,0.6);
            min-height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
        }

        .box{
            background:white;
            padding:50px;
            border-radius:20px;
            width:450px;
            text-align:center;
            animation:pop 0.8s ease-in;
            box-shadow:0 10px 25px rgba(0,0,0,0.2);
        }

        @keyframes pop{
            from{transform:scale(0.8);opacity:0;}
            to{transform:scale(1);opacity:1;}
        }

        .job-img{
            width:100%;
            height:150px;
            object-fit:cover;
            border-radius:15px;
            margin-bottom:15px;
        }

        .btn-main{
            background:#14b8a6;
            color:white;
            border-radius:30px;
        }
    </style>
</head>

<body>

<div class="overlay">

    <div class="box">

        <!-- IMAGE (UPLOAD PAGE) -->
        <img class="job-img"
             src="https://images.unsplash.com/photo-1581092334651-ddf26d9a09d0">

        <h3>Upload Resume 📄</h3>

        <!-- JOB INFO -->
        <div th:if="${job != null}">
            <h5 th:text="${job.title}"></h5>
            <p class="text-success" th:text="${job.company}"></p>
        </div>

        <!-- FORM -->
        <form th:action="@{/upload}" method="post" enctype="multipart/form-data">

            <input type="hidden" name="jobId" th:value="${jobId}" />

            <input type="file" name="resume" class="form-control mt-3" required>

            <button type="submit" class="btn btn-main w-100 mt-3">
                Upload Resume
            </button>

        </form>

        <a th:href="@{/jobs}" class="d-block mt-3">← Back to Jobs</a>

    </div>

</div>

</body>
</html>
